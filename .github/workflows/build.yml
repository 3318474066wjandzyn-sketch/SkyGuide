name: Build SkyGuide APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SkyGuide-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip SkyGuide-Android-Source.zip -d source
          test -f source/SkyGuide/app/build.gradle.kts

      - name: Build APK
        working-directory: source/SkyGuide
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyGuide-APK
          path: source/SkyGuide/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
